services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gameframe
      POSTGRES_USER: gameframe
      POSTGRES_PASSWORD: ${GF_POSTGRES_PASSWORD:?Set the local database password before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameframe -d gameframe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
