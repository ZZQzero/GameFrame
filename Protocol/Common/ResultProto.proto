syntax = "proto3";
package game.protocol.common;
option csharp_namespace = "Game.Hotfix.Network.Protocol";
// Business results only. Frame StatusCode carries transport/dispatch failures.
// Success is zero. New results change the protocol hash; unknown values are rejected.
enum ResultCode {
  Success = 0;
  InvalidCredentials = 1;
  SessionExpired = 2;
  SessionRevoked = 3;
  InvalidInput = 11;
  AccountAlreadyExists = 12;
}

message OperationResponse {
  ResultCode result_code = 1;
}
