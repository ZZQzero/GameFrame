syntax = "proto3";
package game.protocol.diagnostics;
option csharp_namespace = "Game.Protocol.Diagnostics";
import "Common/net_options.proto";
import "Diagnostics/DiagnosticsProto.proto";

service DiagnosticsService {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (game.net.route) = { opcode: 1900 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
}
