syntax = "proto3";
package game.protocol.gomoku;
option csharp_namespace = "Game.Protocol.Gomoku";
import "Common/net_options.proto";
import "Gomoku/GomokuProto.proto";
import "google/protobuf/empty.proto";

service GomokuService {
  rpc CreateGomokuRoom(CreateRoomRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3000 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc JoinGomokuRoom(JoinRoomRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3001 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc QueryMyGomokuRoom(QueryRoomRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3002 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc SetGomokuReady(SetReadyRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3003 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc StartGomokuGame(StartGameRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3004 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc PlaceGomokuMove(PlaceMoveRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3005 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc LeaveGomokuRoom(LeaveRoomRequest) returns (GomokuResponse) {
    option (game.net.route) = { opcode: 3006 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
  rpc GomokuRoomSnapshot(GomokuSnapshot) returns (google.protobuf.Empty) {
    option (game.net.route) = { opcode: 3010 kind: ROUTE_KIND_SERVER_PUSH delivery: DELIVERY_RELIABLE };
  }
  rpc GomokuRoomClosed(GomokuSnapshot) returns (google.protobuf.Empty) {
    option (game.net.route) = { opcode: 3011 kind: ROUTE_KIND_SERVER_PUSH delivery: DELIVERY_RELIABLE };
  }
}
