syntax = "proto3";
package game.protocol.session;
option csharp_namespace = "Game.Protocol.Session";
import "Common/net_options.proto";
import "Common/ResultProto.proto";

// Credentials are submitted by the client over WSS, never configured as a server identity.
message RegisterRequest {
  string account = 1 [(game.net.max_utf16) = 64, (game.net.max_utf8) = 256];
  string password = 2 [(game.net.max_utf16) = 128, (game.net.max_utf8) = 512];
}

message LoginRequest {
  string account = 1 [(game.net.max_utf16) = 64, (game.net.max_utf8) = 256];
  string password = 2 [(game.net.max_utf16) = 128, (game.net.max_utf8) = 512];
}

message LoginResponse {
  game.protocol.common.ResultCode result_code = 1;
  uint64 account_id = 2;
  // Exactly 16 bytes on success; separate from transport session IDs.
  bytes account_session_id = 3 [(game.net.max_count) = 16];
  // Server-owned account generation. Resume preserves it; a new Login replaces it.
  uint64 auth_epoch = 4;
  // Exactly 32 bytes on success; rotated atomically by ResumeLogin, never logged.
  bytes resume_token = 5 [(game.net.max_count) = 32];
  // UTC is for diagnostics. TTL scheduling uses local admission monotonic time.
  int64 resume_expires_at_utc_ms = 6;
  int64 account_expires_at_utc_ms = 7;
  uint32 resume_remaining_ttl_ms = 8;
  uint32 account_remaining_ttl_ms = 9;
}

message ResumeLoginRequest {
  bytes account_session_id = 1 [(game.net.max_count) = 16];
  bytes resume_token = 2 [(game.net.max_count) = 32];
}

message LogoutRequest {
}
