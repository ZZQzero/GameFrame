syntax = "proto3";
package game.protocol.session;
option csharp_namespace = "Game.Hotfix.Network.Protocol";
import "Common/net_options.proto";

message LoginRequest {
  string account = 1 [(game.net.max_utf16) = 64, (game.net.max_utf8) = 256];
  string password = 2 [(game.net.max_utf16) = 128, (game.net.max_utf8) = 512];
}

message LoginResponse {
  uint32 result_code = 1;
  uint64 account_id = 2;
  bytes account_session_id = 3 [(game.net.max_count) = 16];
  uint64 auth_epoch = 4;
  bytes resume_token = 5 [(game.net.max_count) = 32];
  int64 resume_expires_at_utc_ms = 6;
  int64 account_expires_at_utc_ms = 7;
  uint32 resume_remaining_ttl_ms = 8;
  uint32 account_remaining_ttl_ms = 9;
}

message ResumeLoginRequest {
  bytes account_session_id = 1 [(game.net.max_count) = 16];
  bytes resume_token = 2 [(game.net.max_count) = 32];
}

message RequestBattleGrantRequest {
  uint64 grant_request_id = 1;
  uint64 character_id = 2;
  uint64 world_id = 3;
  bytes protocol_hash = 4 [(game.net.max_count) = 32];
}

message BattleGrantResponse {
  uint32 result_code = 1;
  uint64 grant_id = 2;
  string host = 3 [(game.net.max_utf16) = 256, (game.net.max_utf8) = 1024];
  uint32 port = 4 [(game.net.scalar) = "uint16"];
  bytes ticket = 5 [(game.net.max_count) = 512];
  uint32 conv = 6;
  bytes psk_identity = 7 [(game.net.max_count) = 16];
  bytes psk = 8 [(game.net.max_count) = 32];
  int64 expires_at_utc_ms = 9;
  uint32 remaining_ttl_ms = 10;
  uint32 reliable_limit = 11;
  uint32 unreliable_limit = 12;
}

message LogoutRequest {
}

message OperationResponse {
  uint32 result_code = 1;
}

message EnterWorldRequest {
  uint64 character_id = 1;
  uint64 world_id = 2;
  uint64 auth_epoch = 3;
}

message RestoreWorldRequest {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint64 last_event_version = 3;
  uint64 auth_epoch = 4;
}

message LeaveWorldRequest {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
}

message WorldResponse {
  uint32 result_code = 1;
  bytes world_session_id = 2 [(game.net.max_count) = 16];
  uint64 world_epoch = 3;
  uint64 event_version = 4;
  uint32 tick = 5;
  repeated EntityState entities = 6 [(game.net.max_count) = 64];
}

message EntityState {
  uint64 entity_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  uint32 tick = 5;
}

message WorldEvent {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint64 event_version = 3;
  EntityState entity = 4;
}

message WorldSnapshot {
  uint64 world_epoch = 1;
  uint32 tick = 2;
  repeated EntityState entities = 3 [(game.net.max_count) = 16];
}

message MoveCommand {
  uint64 command_id = 1;
  uint32 client_tick = 2;
  int32 direction_x = 3 [(game.net.scalar) = "int16"];
  int32 direction_z = 4 [(game.net.scalar) = "int16"];
  uint64 entity_id = 5;
  uint64 world_epoch = 6;
}

message EchoRequest {
  string text = 1 [(game.net.max_utf16) = 128, (game.net.max_utf8) = 512];
  uint32 delay_ms = 2;
}

message EchoResponse {
  string text = 1 [(game.net.max_utf16) = 128, (game.net.max_utf8) = 512];
}
