syntax = "proto3";
package game.protocol.session;
option csharp_namespace = "Game.Protocol.Session";
import "Common/net_options.proto";
import "Common/ResultProto.proto";
import "Session/SessionProto.proto";

service SessionService {
  rpc Register(RegisterRequest) returns (game.protocol.common.OperationResponse) {
    option (game.net.route) = { opcode: 1004 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (game.net.route) = { opcode: 1000 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }

  rpc ResumeLogin(ResumeLoginRequest) returns (LoginResponse) {
    option (game.net.route) = { opcode: 1001 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }

  rpc Logout(LogoutRequest) returns (game.protocol.common.OperationResponse) {
    option (game.net.route) = { opcode: 1003 kind: ROUTE_KIND_RPC delivery: DELIVERY_RELIABLE };
  }
}
