syntax = "proto3";
package game.protocol.world;
option csharp_namespace = "Game.Hotfix.Network.Protocol";
import "Common/net_options.proto";
import "Common/ResultProto.proto";

message EnterWorldRequest {
  uint64 character_id = 1;
  uint64 world_id = 2;
  // Expected generation only; the server uses the authenticated connection binding.
  uint64 auth_epoch = 3;
}

message RestoreWorldRequest {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint64 last_event_version = 3;
  uint64 auth_epoch = 4;
}

message LeaveWorldRequest {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
}

// Enter/Restore returns a full AOI baseline for the current small-world example.
// More than 64 entities returns TooManyEntities; never silently truncate.
message WorldResponse {
  game.protocol.common.ResultCode result_code = 1;
  bytes world_session_id = 2 [(game.net.max_count) = 16];
  // Server increments on successful restore/rebind; invalidates old inputs/snapshots.
  uint64 world_epoch = 3;
  uint64 event_version = 4;
  uint32 server_tick = 5;
  repeated EntityState entities = 6 [(game.net.max_count) = 64];
}

message EntityState {
  uint64 entity_id = 1;
  // New entity lifetime gets a new nonzero incarnation even when ID is reused.
  uint32 incarnation = 2;
  // Quantized world coordinates in millimeters; one Unity world unit is one meter.
  int32 position_x_mm = 3;
  int32 position_y_mm = 4;
  int32 position_z_mm = 5;
}

// Reliable membership events share one contiguous event_version stream.
message WorldEntityEntered {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint64 event_version = 3;
  uint32 server_tick = 4;
  EntityState entity = 5;
}

message WorldEntityLeft {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint64 event_version = 3;
  uint64 entity_id = 4;
  uint32 incarnation = 5;
}

// Independent absolute states for a partial AOI batch, not a membership list.
// Omitted entities remain present; unknown/old incarnations are discarded.
message WorldSnapshot {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint32 server_tick = 3;
  // Per-world-epoch packet sequence; compared per entity using u32 wraparound.
  uint32 snapshot_sequence = 4;
  repeated EntityState entities = 5 [(game.net.max_count) = 16];
}

// Input sampling has sequence/tick semantics, not durable transaction idempotency.
message MoveInput {
  bytes world_session_id = 1 [(game.net.max_count) = 16];
  uint64 world_epoch = 2;
  uint32 input_sequence = 3;
  uint32 client_tick = 4;
  // Signed normalized axes [-32767, 32767]; magnitude must not exceed one.
  int32 direction_x = 5 [(game.net.scalar) = "int16"];
  int32 direction_z = 6 [(game.net.scalar) = "int16"];
  uint64 entity_id = 7;
  uint32 incarnation = 8;
}
